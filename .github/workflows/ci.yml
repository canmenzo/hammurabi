name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Build release
        run: cargo build --release --all-targets

      - name: Build release (metal)
        if: runner.os == 'macOS'
        run: cargo build --release --features metal

      - name: Test release
        run: cargo test --release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: hammurabi-${{ matrix.os }}
          path: |
            target/release/hammurabi${{ runner.os == 'Windows' && '.exe' || '' }}
            target/release/hammurabi-cli${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
